<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POINTLESS(TM) DELUXE</title>
<meta name="description" content="A deliberately, gloriously useless arcade of pointless activities, supervised by Management.">
<link rel="stylesheet" href="core/base.css">
</head>
<body>
<div id="app" class="pm-app"><noscript>POINTLESS(TM) DELUXE requires JavaScript. Management regrets that nothing cannot be done without it.</noscript></div>

<!-- engine: fixed order -->
<script src="core/00-registry.js"></script>
<script src="core/05-fallback.js"></script>
<script src="core/10-storage.js"></script>
<script src="core/20-state.js"></script>
<script src="core/30-sfx.js"></script>
<script src="core/40-narrator.js"></script>
<script src="core/45-fx.js"></script>
<script src="core/50-api.js"></script>
<script src="core/60-host.js"></script>
<script src="core/70-fuzz.js"></script>
<!-- generated by `node tools/build.js`: lists core/ui-*.js|css, content/*.js, games/*.js -->
<script src="generated/manifest.js"></script>
<script>
/* Loader: document.write keeps classic-script ordering and works from file://.
   ui scripts -> content packs -> games. ?dev=<id> / ?selftest=<id> load ONLY games/<id>.js.
   A script that fails to load or throws is reported by core/00-registry.js (diagnostics) and does not stop the others. */
(function () {
  var F = window.__POINTLESS_FILES || { ui: [], css: [], content: [], games: [] };
  var q = {};
  try { q = new URLSearchParams(location.search); } catch (e) { q = { get: function () { return null; } }; }
  var only = q.get('selftest') || q.get('dev') || '';
  var ID = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
  var out = [];
  function script(src) { out.push('<scr' + 'ipt src="' + src + '"></scr' + 'ipt>'); }
  (F.css || []).forEach(function (f) { out.push('<link rel="stylesheet" href="' + f + '">'); });
  (F.ui || []).forEach(script);
  (F.content || []).forEach(script);
  if (only && only !== 'lobby') { if (ID.test(only)) script('games/' + only + '.js'); }
  else (F.games || []).forEach(script);
  if (!window.__POINTLESS_FILES && window.POINTLESS) {
    window.POINTLESS.diag.add('warn', 'generated/manifest.js is missing: run "node tools/build.js"');
  }
  document.write(out.join('\n'));
})();
</script>
<script src="core/99-boot.js"></script>
</body>
</html>
